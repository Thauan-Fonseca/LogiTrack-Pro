services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logitrack_pro
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: logitrack123
    ports:
      - "5433:5432"
    volumes:
      - logitrack_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d logitrack_pro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logitrack_pro
      SPRING_DATASOURCE_USERNAME: logitrack
      SPRING_DATASOURCE_PASSWORD: logitrack123
      # O navegador manda a origem http://localhost:8081 (onde o Nginx serve o
      # front) mesmo em requisições same-origin — precisa estar liberada aqui.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8081:80"

volumes:
  logitrack_db_data:
